name: Build PongPS2 ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ELF and ISO
        run: |
          apk add --no-cache make genisoimage
          make clean
          make
          make iso
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PongPS2-build
          path: |
            PONGPS2.ELF
            PongPS2.iso
